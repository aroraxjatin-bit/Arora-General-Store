<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arora Store | Dairy Manager</title>
<meta name="theme-color" content="#17364d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<style>
:root{--navy:#17364d;--navy2:#244c62;--cream:#f7f5ed;--paper:#fffefa;--green:#477b61;--green2:#e8f1e9;--gold:#c6a45a;--ink:#263744;--muted:#71808a;--line:#e8e5da;--shadow:0 12px 34px rgba(27,48,59,.09)}
*{box-sizing:border-box}body{margin:0;padding:22px 14px 38px;background:linear-gradient(145deg,#f3f1e8,#eef3ef 58%,#f7f4eb);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.app{max-width:980px;margin:auto}.shell{background:var(--paper);border:1px solid rgba(198,164,90,.24);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.hero{background:linear-gradient(120deg,var(--navy),#244b5c);color:#fff;padding:24px 26px 22px;position:relative}.hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(221,195,132,.22);border-radius:50%;right:-65px;top:-125px;box-shadow:0 0 0 22px rgba(255,255,255,.025),0 0 0 48px rgba(255,255,255,.02)}.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}.brand img{width:86px;height:86px;object-fit:cover;border-radius:50%;border:3px solid var(--gold);background:#f7f5ed}.brand h1{font-size:clamp(23px,4vw,32px);margin:0 0 4px;letter-spacing:.2px}.brand p{margin:0;color:#e7e2d4;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}.menu-btn{margin-left:auto;z-index:2;position:relative;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:white;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer}.content{padding:22px 24px 26px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.date-wrap{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:700}.date-wrap input{border:1px solid #d8d9d0;background:white;border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink)}.hint{font-size:12px;color:var(--muted)}.summary{display:flex;align-items:center;justify-content:space-between;gap:15px;background:linear-gradient(115deg,#edf3e9,#f5f0df);border:1px solid #e2e7d8;border-radius:18px;padding:17px 20px;margin-bottom:22px}.summary-label{font-size:12px;color:#63776a;text-transform:uppercase;font-weight:800;letter-spacing:1.2px}.summary-value{font-size:clamp(26px,5vw,34px);font-weight:800;color:var(--navy);margin-top:3px;font-variant-numeric:tabular-nums}.summary-icon{width:48px;height:48px;border-radius:15px;background:#fff9e9;color:#a3833e;display:grid;place-items:center;font-size:25px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 0 12px}.section-head h2{margin:0;color:var(--navy);font-size:18px}.section-head span{font-size:12px;color:var(--muted)}.product-list{display:grid;gap:9px}.product{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(82px,.65fr) minmax(100px,.8fr) minmax(95px,.8fr);align-items:center;gap:12px;background:white;border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:border-color .15s,box-shadow .15s}.product:focus-within{border-color:#b9cba9;box-shadow:0 0 0 3px rgba(71,123,97,.09)}.pname{font-weight:700;color:#304454;font-size:14px}.price-label,.total-label{font-size:11px;color:#87918f;text-transform:uppercase;letter-spacing:.7px;display:none}.price{font-weight:700;color:#667b6b;font-variant-numeric:tabular-nums}.qty{width:100%;min-width:0;border:1px solid #d9ded7;border-radius:9px;padding:10px 9px;font:inherit;font-size:16px;text-align:center;color:var(--navy);background:#fcfdf9;outline:none}.qty:focus{border-color:var(--green);background:white}.line-total{text-align:right;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:13px 14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s,filter .12s}.btn:active{transform:scale(.98)}.primary{background:var(--green);color:white;box-shadow:0 5px 12px rgba(71,123,97,.18)}.secondary{background:#edf1eb;color:var(--navy)}.danger{background:#f7ece7;color:#98543e}.footer-note{text-align:center;color:#87918f;font-size:11px;margin-top:18px}.history-panel{display:none;position:fixed;inset:0;background:rgba(16,35,48,.45);z-index:10;justify-content:flex-end}.history-card{background:var(--paper);width:min(430px,92vw);height:100%;padding:22px;overflow:auto;box-shadow:-10px 0 35px rgba(0,0,0,.15)}.history-head{display:flex;align-items:center;justify-content:space-between}.history-head h2{color:var(--navy)}.close{border:0;background:#edf1eb;border-radius:10px;padding:9px 12px;font-size:18px}.history-item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.history-item strong{color:var(--navy)}.empty{color:var(--muted);padding:20px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:20;font-size:14px}
@media(max-width:620px){
body{padding:0;background:var(--cream)}
.shell{border:0;border-radius:0;min-height:100vh}
.hero{padding:18px 16px}
.brand{gap:12px}
.brand img{width:66px;height:66px}
.brand p{font-size:10px;letter-spacing:1px}
.menu-btn{padding:9px 10px;font-size:12px}
.content{padding:17px 13px 24px}
.summary{padding:14px 16px;margin-bottom:18px}
.product{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:13px 12px}
.product .pname{grid-column:1/-1;font-size:14px;padding-bottom:2px}
.product .price-col{display:block;min-width:0}
.product .price-label,.product .total-label{display:block;margin-bottom:4px;font-size:10px}
.product .price{font-size:13px;white-space:nowrap}
.product .line-total{text-align:right;font-size:13px;align-self:end}
.product .qty{padding:10px 5px;font-size:15px}
.actions{grid-template-columns:1fr 1fr}
.actions .primary{grid-column:1/-1}
.date-wrap{width:100%;justify-content:space-between}
.date-wrap input{flex:1;max-width:190px}
.section-head span{font-size:11px}
}
</style></head>
<body><main class="app"><div class="shell"><header class="hero"><div class="brand"><img src="arora-store-logo.png" alt="Arora Store logo"><div><h1>Arora Store</h1><p>Dairy Manager</p></div><button class="menu-btn" onclick="openHistory()">☰ &nbsp; History</button></div></header>
<section class="content"><div class="topline"><label class="date-wrap">Entry Date <input type="date" id="date"></label><span class="hint">Enter quantity for each product</span></div>
<div class="summary"><div><div class="summary-label">Today's collection total</div><div class="summary-value">₹ <span id="grandTotal">0.00</span></div></div><div class="summary-icon">₹</div></div>
<div class="section-head"><h2>Product entries</h2><span>Price × Quantity = Total</span></div>
<div class="product-list" id="productList"></div>
<div class="actions"><button class="btn primary" onclick="saveData()">✓ &nbsp; Save Day</button><button class="btn secondary" onclick="downloadExcel()">↓ &nbsp; Download Excel</button><button class="btn danger" onclick="resetData()">↺ &nbsp; Clear Entries</button></div><div class="footer-note">Arora Store · Dairy Manager</div></section></div></main>
<div class="history-panel" id="historyPanel" onclick="if(event.target===this)closeHistory()"><div class="history-card"><div class="history-head"><h2>Saved History</h2><button class="close" onclick="closeHistory()">✕</button></div><div id="historyList"></div></div></div><div class="toast" id="toast"></div>
<script>
const products=[
['Full Cream Milk 2 LTR',874],['Full Cream Milk 1 LTR',886],['Full Cream Milk 0.5 LTR',886],['Buffalo Milk',83.16],['Toned Milk 1 LTR',59],['Toned Milk 0.5 LTR',60],['Double Toned Milk',54.50],['Cow Milk',64],['Curd 400 GM',34],['Curd 200 GM',19],['Curd Cup',90],['Curd 1 KG',80],['Buttermilk',9.50],['Paneer',81],['Butter 100 GM',540]
];
const money=n=>Number(n||0).toFixed(2);function renderProducts(){document.getElementById('productList').innerHTML=products.map((p,i)=>`<div class="product"><div class="pname">${p[0]}</div><div class="price-col"><div class="price-label">Price</div><div class="price">₹${money(p[1])}</div></div><div><div class="price-label">Quantity</div><input class="qty" type="number" min="0" step="any" inputmode="decimal" aria-label="Quantity for ${p[0]}" data-index="${i}" oninput="calc()"></div><div class="line-total"><div class="total-label">Total</div><span class="row-total">₹0.00</span></div></div>`).join('')}
function calc(){let grand=0;document.querySelectorAll('.product').forEach((row,i)=>{const qty=Number(row.querySelector('.qty').value)||0;const total=qty*products[i][1];row.querySelector('.row-total').textContent='₹'+money(total);grand+=total});document.getElementById('grandTotal').textContent=money(grand);return grand}
function getRecord(){const quantities=[...document.querySelectorAll('.qty')].map(x=>Number(x.value)||0);return {date:document.getElementById('date').value,grand:money(calc()),items:products.map((p,i)=>({name:p[0],price:p[1],qty:quantities[i],total:money(quantities[i]*p[1])}))}}
function getRecords(){try{return JSON.parse(localStorage.getItem('records')||'[]')}catch(e){return []}}
function saveData(){const record=getRecord();if(!record.date){showToast('Please select a date');return}const records=getRecords();const idx=records.findIndex(r=>r.date===record.date);if(idx>=0){if(!confirm('A record already exists for this date. Replace it with the current entries?'))return;records[idx]=record}else records.push(record);records.sort((a,b)=>a.date.localeCompare(b.date));localStorage.setItem('records',JSON.stringify(records));showToast('Day saved successfully')}
function openHistory(){const list=document.getElementById('historyList');const records=getRecords().sort((a,b)=>b.date.localeCompare(a.date));list.innerHTML=records.length?records.map(r=>`<div class="history-item"><span>${r.date}</span><strong>₹${money(r.grand)}</strong></div>`).join(''):'<div class="empty">No saved entries yet.</div>';document.getElementById('historyPanel').style.display='flex'}function closeHistory(){document.getElementById('historyPanel').style.display='none'}
function downloadExcel(){const records=getRecords();if(!records.length){showToast('No saved records to export');return}const detail=[['Date','Product','Price (₹)','Quantity','Total (₹)']];records.forEach(r=>{if(r.items&&r.items.length){r.items.forEach(i=>detail.push([r.date,i.name,i.price,i.qty,Number(i.total)]))}else detail.push([r.date,'Previous saved total','','',Number(r.grand)])});const daily=[['Date','Daily Total (₹)'],...records.map(r=>[r.date,Number(r.grand)])];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(detail),'Product Details');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(daily),'Daily Summary');XLSX.writeFile(wb,'Arora-Store-Dairy-Records.xlsx')}
function resetData(){if(!confirm('Clear all quantities from this screen? Saved history will remain safe.'))return;document.querySelectorAll('.qty').forEach(x=>x.value='');calc()}function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function localDate(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}document.getElementById('date').value=localDate();renderProducts();calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
